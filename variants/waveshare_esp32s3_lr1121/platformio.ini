; Waveshare ESP32-S3-LR1121 (HF: 850-930 MHz + 2.4 GHz)
; ESP32-S3FH4R2 (4MB flash, 2MB PSRAM), native USB-CDC via the Tiny-Adapter FPC.
; No user LED, battery sense or user button (BOOT is GPIO0).
[Waveshare_S3_LR1121]
extends = esp32_base
board = esp32-s3-zero
; min_spiffs: 1.9MB OTA app slots; one layout for every role so switching roles keeps the filesystem
board_build.partitions = min_spiffs.csv
build_flags = ${esp32_base.build_flags}
  -I variants/waveshare_esp32s3_lr1121
  -D BOARD_HAS_PSRAM
  -D P_LORA_DIO_1=38
  -D P_LORA_NSS=42
  -D P_LORA_RESET=39
  -D P_LORA_BUSY=41
  -D P_LORA_SCLK=40
  -D P_LORA_MISO=46
  -D P_LORA_MOSI=45
  -D RADIO_CLASS=CustomLR1121
  -D WRAPPER_CLASS=CustomLR1121Wrapper
  -D LR11X0_DIO3_TCXO_VOLTAGE=1.8
  -D LR1121_FORCE_HP_PA   ; RFO_LP_LF is not fitted (R4 NC)
  -D RX_BOOSTED_GAIN=true
  -D LORA_TX_POWER=22
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/waveshare_esp32s3_lr1121>
lib_deps =
  ${esp32_base.lib_deps}
