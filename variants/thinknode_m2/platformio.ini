[ThinkNode_M2]
extends = esp32_base
board = ESP32-S3-WROOM-1-N4
build_flags = ${esp32_base.build_flags}
  -I variants/thinknode_m2
  -D THINKNODE_M2
  -D GPS_RX=44
  -D GPS_TX=43
  -D PIN_VEXT_EN=46
  -D PIN_BUZZER=5
  -D PIN_VEXT_EN_ACTIVE=HIGH
  -D PIN_BOARD_SCL=15
  -D PIN_BOARD_SDA=16
  -D P_LORA_DIO_1=3
  -D P_LORA_NSS=10
  -D P_LORA_RESET=21   ; RADIOLIB_NC
  -D P_LORA_BUSY=14   ;  DIO2 = 38
  -D P_LORA_SCLK=12
  -D P_LORA_MISO=13
  -D P_LORA_MOSI=11
  -D PIN_USER_BTN=47
  -D PIN_STATUS_LED=6
  -D PIN_LED=6
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=3.3
  -D SX126X_CURRENT_LIMIT=140
  -D DISPLAY_CLASS=SH1106Display
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
;  -D MESH_DEBUG=1
build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/ui/SH1106Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../variants/thinknode_m2>
lib_deps = ${esp32_base.lib_deps}
  adafruit/Adafruit SH110X @ ~2.1.13
  adafruit/Adafruit GFX Library @ ^1.12.1

; Base for the Water/Air edition envs; the standalone [env:ThinkNode_M2_LoRaFish_companion_ble] lives in
; platformio-meshcore.ini (hidden from the picker).
[ThinkNode_M2_LoRaFish_companion_ble_base]
extends = ThinkNode_M2
board_build.partitions = variants/thinknode_m2/partitions_lorafish_single_app.csv
board_upload.maximum_size = 2621440
build_flags =
  ${ThinkNode_M2.build_flags}
  -I examples/companion_radio/ui-new
  -D LORAFISH_UI=1
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D AUTO_OFF_MILLIS=30000
build_src_filter = ${ThinkNode_M2.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${ThinkNode_M2.lib_deps}
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0
