[Xiao_esp32_C3]
extends = esp32_base
board = seeed_xiao_esp32c3
build_flags =
  ${esp32_base.build_flags}
  -I variants/xiao_c3
  -D ESP32_CPU_FREQ=80
  -D PIN_VBAT_READ=D0
  -D P_LORA_DIO_1=D1
  -D P_LORA_NSS=D4
  -D P_LORA_RESET=D2
  -D P_LORA_BUSY=D3
  -D PIN_BOARD_SDA=D6
  -D PIN_BOARD_SCL=D7
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D SX126X_RX_BOOSTED_GAIN=1
  -D LORA_TX_POWER=22
  -D SX126X_RXEN=D5
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/xiao_c3>
  +<helpers/sensors>
lib_deps =
  ${esp32_base.lib_deps}
