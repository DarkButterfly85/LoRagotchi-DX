; Air edition targets inherit the device-specific LoRaFish/LoRaGotchi setup.
; Existing target names remain the default DX edition.

[env:air_thinknode_m2_ble]
extends = env:ThinkNode_M2_LoRaFish_companion_ble
build_flags = ${env:ThinkNode_M2_LoRaFish_companion_ble.build_flags}
  -D LORAGOTCHI_AIR_EDITION=1

[env:air_heltec_v3_ble]
extends = env:Heltec_v3_LoRaFish_companion_ble
build_flags = ${env:Heltec_v3_LoRaFish_companion_ble.build_flags}
  -D LORAGOTCHI_AIR_EDITION=1

