;
; Heltec T114 without display
;
[Heltec_t114]
extends = nrf52_base
board = heltec_t114
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${nrf52_base.build_flags}
  ${sensor_base.build_flags}
  -I lib/nrf52/s140_nrf52_6.1.1_API/include
  -I lib/nrf52/s140_nrf52_6.1.1_API/include/nrf52
  -I variants/heltec_t114
  -I src/helpers/ui
  -D HELTEC_T114
  -D P_LORA_DIO_1=20
  -D P_LORA_NSS=24
  -D P_LORA_RESET=25
  -D P_LORA_BUSY=17
  -D P_LORA_SCLK=19
  -D P_LORA_MISO=23
  -D P_LORA_MOSI=22
  -D P_LORA_TX_LED=35
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_POWER_EN=37
  -D SX126X_DIO2_AS_RF_SWITCH=true
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D PIN_GPS_RX=39
  -D PIN_GPS_TX=37
  -D PIN_GPS_EN=21
  -D PIN_GPS_RESET=38
  -D PIN_GPS_RESET_ACTIVE=LOW
  -D ENV_PIN_SDA=PIN_WIRE1_SDA
  -D ENV_PIN_SCL=PIN_WIRE1_SCL
build_src_filter = ${nrf52_base.build_src_filter}
  +<helpers/*.cpp>
  +<helpers/sensors>
  +<../variants/heltec_t114>
lib_deps =
  ${nrf52_base.lib_deps}
  ${sensor_base.lib_deps}
debug_tool = jlink
upload_protocol = nrfutil

;
; Heltec T114 with ST7789 display
;
[Heltec_t114_with_display]
extends = Heltec_t114
board = heltec_t114
board_build.ldscript = boards/nrf52840_s140_v6.ld
build_flags = ${Heltec_t114.build_flags}
  -D ST7789
  -D HELTEC_T114_WITH_DISPLAY
  -D DISPLAY_CLASS=ST7789Display
build_src_filter = ${Heltec_t114.build_src_filter}
  +<helpers/ui/ST7789Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/ui/OLEDDisplay.cpp>
  +<helpers/ui/OLEDDisplayFonts.cpp>
lib_deps =
  ${Heltec_t114.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
debug_tool = jlink
upload_protocol = nrfutil

;
; LoRaGotchi DX (LoRaFish companion UI) - Heltec T114 with ST7789 display
; Port of the Heltec_t096_LoRaFish_companion_ble build onto the T114 hardware.
;
[env:Heltec_t114_LoRaFish_companion_ble]
extends = Heltec_t114
board_build.ldscript = boards/nrf52840_s140_v6_extrafs.ld
board_upload.maximum_size = 712704
build_flags =
  ${Heltec_t114.build_flags}
  -I examples/companion_radio/ui-new
  -D HELTEC_T114_WITH_DISPLAY
  -D T114_LCD_DRIVER
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D DISPLAY_WIDTH=135
  -D DISPLAY_HEIGHT=240
  -D DISPLAY_ROTATION=1
  -D DISPLAY_SCALE_X=1.875f
  -D DISPLAY_SCALE_Y=2.109375f
  -D TFT_SPI_SPEED=16e6
  -D PIN_TFT_LEDA_CTL_ACTIVE=LOW
  -D LORAFISH_UI=1
  -D LORAGOTCHI_NATIVE_UI=1
  -D LORAFISH_STRIP_REDRAW=1
  -D PIN_BUZZER=46
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D BLE_PIN_CODE=123456
  -D ENV_INCLUDE_GPS=1
  -D OFFLINE_QUEUE_SIZE=256
  -D AUTO_OFF_MILLIS=30000
build_src_filter = ${Heltec_t114.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/nrf52/SerialBLEInterface.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_t114.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  adafruit/Adafruit GFX Library @ ^1.12.1
  densaugeo/base64 @ ~1.4.0
  end2endzone/NonBlockingRTTTL@^1.3.0

