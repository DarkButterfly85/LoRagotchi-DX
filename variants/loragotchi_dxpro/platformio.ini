; DX-Pro targets: one firmware with the Water, Air and Land species sets (menu: set, then species).
; Each target is the matching water_* target with LORAGOTCHI_DXPRO=1 as the only flag added.

[env:dxpro_thinknode_m2_ble]
extends = ThinkNode_M2_LoRaFish_companion_ble_base
build_flags = ${ThinkNode_M2_LoRaFish_companion_ble_base.build_flags}
  -D LORAGOTCHI_DXPRO=1

