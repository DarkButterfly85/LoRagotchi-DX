; Experimental LoRagotchi-DX profiles: TFT/OLED ONLY. No physical hardware validation.
; Inherit existing MeshCore board/radio/partition wiring; change application UI only.
; Each image requires the listed display and working control input fitted.

[env:Ebyte_EoRa-S3_LoRaGotchi_DX_ble]
extends = env:Ebyte_EoRa-S3_companion_radio_ble
build_flags =
  ${env:Ebyte_EoRa-S3_companion_radio_ble.build_flags}
  -D LORAFISH_UI=1
  -D LORAGOTCHI_EXPERIMENTAL=1
  -D AUTO_OFF_MILLIS=30000
build_src_filter =
  ${env:Ebyte_EoRa-S3_companion_radio_ble.build_src_filter}
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${env:Ebyte_EoRa-S3_companion_radio_ble.lib_deps}
  end2endzone/NonBlockingRTTTL@^1.3.0

