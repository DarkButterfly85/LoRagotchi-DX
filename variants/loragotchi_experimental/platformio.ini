[env:Heltec_T190_LoRaGotchi_DX_ble]
extends = Heltec_T190_companion_radio_ble_
build_unflags = -DST7789 -DDISPLAY_CLASS=ST7789Display
build_flags =
  ${Heltec_T190_companion_radio_ble_.build_flags}
  -D DISPLAY_CLASS=ST7789LCDDisplay
  -D LORAGOTCHI_T190_COLOR=1
  -D LORAGOTCHI_NATIVE_UI=1
  -D LORAFISH_TDECK_FRAMEBUFFER=1
  -D PIN_TFT_MISO=-1
  -D DISPLAY_WIDTH=170
  -D DISPLAY_HEIGHT=320
  ; Baseline MV|MX (rotation 3), rotated 180 degrees: MV|MY (1).
  -D DISPLAY_ROTATION=1
  -D DISPLAY_SCALE_X=2.5f
  -D DISPLAY_SCALE_Y=2.65625f
  -D LORAFISH_UI=1
  -D LORAGOTCHI_EXPERIMENTAL=1
  -D AUTO_OFF_MILLIS=30000
build_src_filter =
  ${Heltec_T190_companion_radio_ble_.build_src_filter}
  -<helpers/ui/ST7789Display.cpp>
  +<helpers/ui/ST7789LCDDisplay.cpp>
  +<helpers/ui/buzzer.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_T190_companion_radio_ble_.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  end2endzone/NonBlockingRTTTL@^1.3.0

