name: Isolated no-feature-loss compiler size trial
permissions:
  contents: read
concurrency:
  group: size-trial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install platformio==6.1.19
    - run: pio test -e native -e native_water -e native_kiss_modem
    - run: python3 test/boards/check_edition_targets.py
    - run: python3 test/boards/check_experimental_screens.py
    - name: Self-contained production host checks
      run: "set -euo pipefail\npython3 - <<'PY'\nimport os, subprocess\nfrom pathlib import Path\nfor test in sorted(Path('test/ui').glob('check_*.py')):\n\
        \    if test.name in {'check_dx_colour_retries.py','check_busy_mesh.py'}:\n        print(f'NOT RUN standalone:\
        \ {test.name} requires independent RX/Aquarium checkout',flush=True)\n        continue\n    subprocess.run(['python3',str(test)],check=True)\n\
        \    if test.name in {'check_menu_navigation.py','check_emoji_dx.py'}:\n        subprocess.run(['python3',str(test)],check=True,\n\
        \            env=dict(os.environ,LORAGOTCHI_TEST_EDITION='1'))\nsubprocess.run(['python3','test/ble/check_pairing_pin.py'],check=True)\n\
        PY\n"
  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
        - environment: water_heltec_v3_ble
          target: build
          format: bin
          tier: owner
        - environment: LilyGo_TBeam_1W_LoRaGotchi_DX_ble
          target: build
          format: bin
          tier: tight-flash-experimental
        - environment: Station_G2_LoRaGotchi_DX_ble
          target: build
          format: bin
          tier: tight-flash-experimental
        - environment: Station_G3_ESP32_LoRaGotchi_DX_ble
          target: build
          format: bin
          tier: tight-flash-experimental
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.sha }}
        fetch-depth: 3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: pip install platformio==6.1.19
    - name: Build selected board only
      env:
        BUILD_ENV: ${{ matrix.environment }}
        BUILD_TARGET: ${{ matrix.target }}
      run: "set -euo pipefail\nif [ \"$BUILD_TARGET\" = create_uf2 ]; then\n  pio run -e \"$BUILD_ENV\" -t create_uf2\
        \ -j 1 2>&1 | tee build.log\nelse\n  pio run -e \"$BUILD_ENV\" -j 1 2>&1 | tee build.log\nfi\n"
    - name: Stage exact-revision evidence
      env:
        BUILD_ENV: ${{ matrix.environment }}
        FORMAT: ${{ matrix.format }}
        TIER: ${{ matrix.tier }}
      run: 'set -euo pipefail

        mkdir -p artifact

        cp ".pio/build/$BUILD_ENV/firmware.$FORMAT" artifact/

        cp ".pio/build/$BUILD_ENV/firmware.elf" artifact/

        if [ "$FORMAT" = bin ]; then cp ".pio/build/$BUILD_ENV/partitions.bin" artifact/; fi

        git rev-parse HEAD > artifact/source-sha.txt

        pio project config --json-output > artifact/platformio-config.json

        pio pkg list -e "$BUILD_ENV" > artifact/dependencies.txt

        cp WATER-EDITION.md docs/RAK4630-EXPERIMENTAL.md artifact/

        echo ''Compilation only; no hardware acceptance. ESP32 app BIN is not a merged installer. Validate bounds
        before flashing.'' > artifact/BUILD-NOTES.txt

        python3 - <<''META''

        import json, os, shutil

        from pathlib import Path

        env=os.environ[''BUILD_ENV'']

        cfg={s:dict(v) for s,v in json.loads(Path(''artifact/platformio-config.json'').read_text())}[''env:''+env]

        board=cfg[''board'']

        paths=[Path(''boards'')/(board+''.json'')]+list((Path.home()/''.platformio/platforms'').glob(''*/boards/''+board+''.json''))

        shutil.copy2(next(p for p in paths if p.is_file()),''artifact/board.json'')

        if os.environ[''FORMAT'']==''uf2'':shutil.copy2(cfg[''board_build.ldscript''],''artifact/application.ld'')

        Path(''artifact/environment.txt'').write_text(env)

        Path(''artifact/classification.txt'').write_text(os.environ[''TIER''])

        META

        (cd artifact && sha256sum * > SHA256SUMS)

        '
    - uses: actions/upload-artifact@v4
      with:
        name: targeted-${{ matrix.environment }}-${{ github.sha }}
        path: artifact/*
        retention-days: 14
        if-no-files-found: error
    - name: Preserve diagnostics including size failures
      if: always()
      env:
        BUILD_ENV: ${{ matrix.environment }}
      run: 'mkdir -p diagnostic

        [ ! -f build.log ] || cp build.log diagnostic/

        find ".pio/build/$BUILD_ENV" -maxdepth 1 -type f \( -name ''*.elf'' -o -name ''*.map'' \) -exec cp {} diagnostic/
        \; 2>/dev/null || true

        git rev-parse HEAD > diagnostic/source-sha.txt

        printf ''%s'' "$BUILD_ENV" > diagnostic/environment.txt

        echo ''DIAGNOSTICS ONLY. Oversized ELF is not installable and must never be flashed.'' > diagnostic/NOT-FOR-FLASHING.txt

        (cd diagnostic && sha256sum * > SHA256SUMS)

        '
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: diagnostic-${{ matrix.environment }}-${{ github.sha }}
        path: diagnostic/*
        retention-days: 14
        if-no-files-found: error
'on':
  push:
    branches:
    - optimize/no-feature-loss-size-20261101
  workflow_dispatch: {}
