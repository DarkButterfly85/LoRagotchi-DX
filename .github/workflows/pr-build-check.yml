name: PR Build Check

# Pull requests build only the LoRaGotchi boards (picker envs named
# *loragotchi*/*dx* plus the Water_/Air_ editions). Stock MeshCore envs live in
# platformio-meshcore.ini, are not in the picker and are never built here.
# native and native_kiss_modem unit tests run in run-unit-tests.yml.

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'boards/**'
      - 'lib/**'
      - 'arch/**'
      - 'tools/ci/**'
      - 'platformio.ini'
      - 'platformio-meshcore.ini'
      - '.github/actions/**'
      - '.github/workflows/pr-build-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate-build-matrix:
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.get-envs.outputs.environments }}
    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Get LoRaGotchi environments
        id: get-envs
        run: echo "environments=$(python3 tools/ci/list-loragotchi-envs.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.generate-build-matrix.outputs.environments) }}

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
