name: Build LoRagotchi-DX standard images

on:
  push:
    branches: [main, 'release/firmware-*']
  pull_request:
    branches: [main, dev]
    paths:
      - 'examples/**'
      - 'src/**'
      - 'variants/**'
      - 'boards/**'
      - 'platformio.ini'
      - 'test/**'
      - 'docs/experimental-screen-targets.json'
      - '.github/workflows/loragotchi-release-build.yml'
      - '.github/workflows/experimental-screen-builds.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - name: Native regressions
        run: pio test -e native -e native_kiss_modem
      - name: Production DX host regressions
        run: |
          python3 - <<'PYTEST'
          import subprocess
          from pathlib import Path
          for test in sorted(Path('test/ui').glob('check_*.py')):
              # These integration tests need independent RX/Aquarium checkouts;
              # retain their local evidence rather than silently mocking them in CI.
              if test.name in {'check_dx_colour_retries.py', 'check_busy_mesh.py'}:
                  print(f"Not run in standalone DX CI: {test.name} (requires RX/Aquarium)", flush=True)
                  continue
              subprocess.run(['python3', str(test)], check=True)
          PYTEST
          python3 test/ble/check_pairing_pin.py

  build:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - environment: Heltec_v3_LoRaFish_companion_ble
            target: build
          - environment: heltec_v4_LoRaFish_companion_ble
            target: build
          - environment: ThinkNode_M2_LoRaFish_companion_ble
            target: build
          - environment: Heltec_t096_LoRaFish_companion_ble
            target: create_uf2
          - environment: Heltec_t114_LoRaFish_companion_ble
            target: create_uf2
          - environment: LilyGo_TDeck_loragotchi_dx_ble
            target: build
          - environment: LilyGo_TDeck_loragotchi_dx_usb
            target: build
          - environment: cardputer_loragotchi
            target: build
          - environment: Tbeam_SX1262_LoRaFish_companion_ble
            target: build
          - environment: Tbeam_SX1276_LoRaFish_companion_ble
            target: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio==6.1.19
      - name: Build exact LoRagotchi profile
        env:
          BUILD_ENV: ${{ matrix.environment }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [ "$BUILD_TARGET" = create_uf2 ]; then
            pio run -e "$BUILD_ENV" -t create_uf2 -j 2
          else
            pio run -e "$BUILD_ENV" -j 2
          fi
      - name: Stage images and provenance
        env:
          BUILD_ENV: ${{ matrix.environment }}
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          mkdir -p release-artifact
          if [ "$BUILD_TARGET" = create_uf2 ]; then
            cp ".pio/build/$BUILD_ENV/firmware.uf2" release-artifact/
          else
            cp ".pio/build/$BUILD_ENV/firmware.bin" release-artifact/
            cp ".pio/build/$BUILD_ENV/partitions.bin" release-artifact/
          fi
          git rev-parse HEAD > release-artifact/source-sha.txt
          pio pkg list -e "$BUILD_ENV" > release-artifact/dependencies.txt
          echo "standard build; compilation is not physical hardware acceptance. See source-sha.txt for the exact revision." > release-artifact/BUILD-NOTES.txt
          cp EGG-ADOPTION.md release-artifact/
          cd release-artifact
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: standard-${{ matrix.environment }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: release-artifact/
          if-no-files-found: error
          retention-days: 14
